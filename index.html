    max-width: 400px;

a {
    display: flex;

    justify-content: center;
    gap: 12px;
    background: white;
    color: #101827;
    text-decoration: none;
    padding: 16px;
    margin: 15px 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

a:hover {
    transform: scale(1.04);
    background: #e5e7eb;
}

a i {
    font-size: 23px;
}
